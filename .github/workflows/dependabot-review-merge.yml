name: Dependabot review and merge

# Dependabot opens its PRs from branches in this repository, so a `pull_request` run
# gets the write permissions declared below and access to Actions secrets. The job is
# gated to dependabot[bot] PRs in this repository, and nothing from the head branch is
# ever checked out or executed here — only the GitHub API is used.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'asgeirn/trekktabell'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-lookup: true
          compat-lookup: true

      # The default GITHUB_TOKEN cannot request Copilot: the API returns success but the
      # request is silently dropped, because a Copilot review has to be attributed to a
      # Copilot-licensed identity. COPILOT_REVIEW_TOKEN must be a PAT owned by such a
      # user, with pull requests write access to this repository.
      - name: Request Copilot code review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::COPILOT_REVIEW_TOKEN is not set; Copilot review cannot be requested."
            exit 1
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' > /dev/null
          # Copilot never appears in `requested_reviewers`, so confirm via the timeline.
          for _ in $(seq 1 6); do
            if gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" --paginate \
                 --jq '.[] | select(.event == "review_requested") | .requested_reviewer.login // empty' \
               | grep -qix 'copilot'; then
              echo "Copilot review requested."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Copilot review request was not registered. Check that COPILOT_REVIEW_TOKEN belongs to a Copilot-licensed user."
          exit 1

      - name: Wait for the Copilot review
        id: review
        run: |
          verdict=none
          for _ in $(seq 1 40); do
            state=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")] | last | .state // empty')
            if [ -n "$state" ]; then
              verdict="$state"
              break
            fi
            sleep 15
          done
          comments=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")] | length')
          {
            echo "verdict=$verdict"
            echo "comments=$comments"
          } >> "$GITHUB_OUTPUT"
          echo "Copilot verdict: $verdict ($comments inline comments)"

      - name: Check that the diff only touches dependency manifests
        id: scope
        run: |
          files=$(gh pr view "$PR_URL" --json files --jq '.files[].path')
          echo "$files"
          unexpected=$(printf '%s\n' "$files" | grep -Ev '^(pom\.xml|Dockerfile|\.github/workflows/[^/]+\.ya?ml|\.github/dependabot\.yml|devbox\.(json|lock)|trekktabell\.yaml)$' || true)
          if [ -n "$unexpected" ]; then
            {
              echo "### Dependabot PR touches unexpected files"
              echo
              printf '%s\n' "$unexpected" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      # Auto-merge requires all of: a clean Copilot approval with no inline comments, a
      # diff confined to dependency manifests, and no upstream maintainer change.
      - name: Decide
        id: decide
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          COMMENTS: ${{ steps.review.outputs.comments }}
          SCOPE_SAFE: ${{ steps.scope.outputs.safe }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: |
          ok=true
          : > reasons.md
          if [ "$VERDICT" != "APPROVED" ]; then
            ok=false
            echo "- Copilot review verdict is \`$VERDICT\`, not \`APPROVED\`." >> reasons.md
          fi
          if [ "$COMMENTS" != "0" ]; then
            ok=false
            echo "- Copilot left $COMMENTS inline comment(s)." >> reasons.md
          fi
          if [ "$SCOPE_SAFE" != "true" ]; then
            ok=false
            echo "- The diff touches files outside the dependency manifests." >> reasons.md
          fi
          if [ "$MAINTAINER_CHANGES" = "true" ]; then
            ok=false
            echo "- Dependabot reports maintainer changes between the two versions." >> reasons.md
          fi
          echo "merge=$ok" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Dependabot update"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Dependencies | ${{ steps.metadata.outputs.dependency-names }} |"
            echo "| Ecosystem | ${{ steps.metadata.outputs.package-ecosystem }} |"
            echo "| Update type | ${{ steps.metadata.outputs.update-type }} |"
            echo "| Dependency type | ${{ steps.metadata.outputs.dependency-type }} |"
            echo "| Version | ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }} |"
            echo "| Maintainer changes | ${{ steps.metadata.outputs.maintainer-changes }} |"
            echo "| Security alert | ${{ steps.metadata.outputs.alert-state }} ${{ steps.metadata.outputs.ghsa-id }} |"
            echo "| Compatibility score | ${{ steps.metadata.outputs.compatibility-score }} |"
            echo "| Copilot verdict | ${{ steps.review.outputs.verdict }} (${{ steps.review.outputs.comments }} inline comments) |"
            echo "| Diff scope OK | ${{ steps.scope.outputs.safe }} |"
            echo "| Auto-merge | ${{ steps.decide.outputs.merge }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hold auto-merge
        if: steps.decide.outputs.merge != 'true'
        run: |
          {
            echo ":warning: Auto-merge is **held** for this dependency update:"
            echo
            cat reasons.md
            echo
            echo "A human should review this pull request before merging."
          } > body.md
          gh pr comment "$PR_URL" --body-file body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      # Merging a PR that touches `.github/workflows/**` requires a token with the
      # workflow scope, which GITHUB_TOKEN never has — so the PAT is used here too.
      # Most PRs from the github-actions ecosystem touch workflow files.
      - name: Enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
        run: |
          if ! gh pr merge --auto --squash "$PR_URL" 2> merge-error.txt; then
            cat merge-error.txt
            if grep -q 'without .workflow' merge-error.txt; then
              echo "::error::COPILOT_REVIEW_TOKEN is missing the 'Workflows: read and write' permission, which is required to merge pull requests that modify .github/workflows."
            fi
            exit 1
          fi
